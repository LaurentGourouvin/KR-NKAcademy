name: Deploy NKAcademy to Production

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.x'
          cache: 'npm'

      - name: Install dependencies and build (CI)
        run: |
          npm ci
          npm run build
          tar czf nkacademy-artifact.tar.gz out

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          {
            echo "Host prod-server"
            echo "  HostName ${{ secrets.DEPLOY_HOST }}"
            echo "  User ${{ secrets.DEPLOY_USER }}"
            echo "  IdentityFile ~/.ssh/id_ed25519"
            echo "  StrictHostKeyChecking no"
          } >> ~/.ssh/config

      - name: Upload build artifact to server
        run: |
          scp nkacademy-artifact.tar.gz prod-server:/tmp/

      - name: Deploy on Lightsail
        run: |
          ssh prod-server << 'EOF'
          set -e
          tar xzf /tmp/nkacademy-artifact.tar.gz -C /tmp
          sudo rsync -a --delete /tmp/out/ /var/www/nkacademy/out/
          sudo chown -R www-data:www-data /var/www/nkacademy/out/
          sudo systemctl reload nginx
          rm -rf /tmp/nkacademy-artifact.tar.gz /tmp/out
          echo "$(date '+%Y-%m-%d %H:%M:%S') - Deployment of NKAcademy on production" >> /home/ubuntu/deploy.log
          EOF
